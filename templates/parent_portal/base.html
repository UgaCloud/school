<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Parent Portal{% endblock %}</title>
<style>
body{margin:0;background:#f4f7fb;color:#203047;font:15px system-ui,sans-serif}.top{background:#173b67;color:white;padding:16px 5%;display:flex;justify-content:space-between}.wrap{max-width:1050px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dde5ef;border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.metric{font-size:24px;font-weight:700}.muted{color:#69788c}.btn{display:inline-block;background:#1769aa;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}.nav a{color:white;margin-left:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #e7ecf2}.messages{list-style:none;padding:0}.messages li{background:#fff4d6;padding:12px;border-radius:8px;margin-bottom:8px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:5px 0 12px}@media(max-width:600px){.wrap{margin:14px auto}.top{padding:14px 16px}.table{font-size:13px}.card{padding:15px}}
</style></head><body><header class="top"><strong>Parent Portal</strong><nav class="nav">{% if request.user.is_authenticated %}<a href="{% url 'parent_dashboard' %}">Home</a><a href="{% url 'parent_logout' %}">Logout</a>{% endif %}</nav></header>
<main class="wrap">{% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main></body></html>
