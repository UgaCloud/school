{% extends 'base.html' %}{% block content %}<div class="container-fluid"><h1>Library catalogue</h1><p><a class="btn btn-primary" href="{% url 'library_book_create' %}">Add title</a></p><form method="get"><input class="form-control" name="q" value="{{ query }}" placeholder="Title, ISBN or author" style="max-width:420px"></form><table class="table table-striped"><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Copies</th><th>Available</th></tr>{% for book in books %}<tr><td><a href="{% url 'library_book_detail' book.id %}">{{ book.title }}</a></td><td>{{ book.author }}</td><td>{{ book.isbn }}</td><td>{{ book.copy_count }}</td><td>{{ book.available_count }}</td></tr>{% empty %}<tr><td colspan="5">No titles found.</td></tr>{% endfor %}</table></div>{% endblock %}
