<table class="table table-striped"><thead><tr><th>Application</th><th>Applicant</th><th>Class</th><th>Status</th><th>Updated</th></tr></thead><tbody>{% for application in applications %}<tr><td><a href="{% url 'admission_detail' application.id %}">{{ application.application_number }}</a></td><td>{{ application.student_name }}</td><td>{{ application.applying_class }}</td><td>{{ application.get_status_display }}</td><td>{{ application.updated_at }}</td></tr>{% empty %}<tr><td colspan="5">No applications found.</td></tr>{% endfor %}</tbody></table>
